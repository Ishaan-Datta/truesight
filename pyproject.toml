[project]
name = "truesight"
version = "0.1.0"
description = "Capture a niri screenshot, extract its text with Surya OCR, and copy it to the clipboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.27,<1",
    "pillow>=10.2,<12",
]

[project.scripts]
truesight = "truesight:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["truesight"]

[tool.setuptools.packages.find]
include = ["surya_slim*"]
